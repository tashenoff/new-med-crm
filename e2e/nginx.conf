server {
  listen 80;
  root /usr/share/nginx/html;
  # Deny external images, scripts, forms and connections before a request is sent.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; form-action 'self'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://api:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
  location /uploads/ { proxy_pass http://api:8001; }
  location / { try_files $uri /index.html; }
}
