version: "3.9"

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_SITE_URL=http://localhost:3000
      - MB_EMBEDDING_SECRET_KEY=6e107b0b6bdbd2736457c8c3c90561dccdf9318004497fb5df66b3af4702ee7d
    volumes:
      - metabase-data:/metabase-data

volumes:
  metabase-data:
    driver: local
